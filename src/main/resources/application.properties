# ====================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO
# ====================================================
spring.application.name=springBootList

# ====================================================
# CONFIGURAÇÃO DA FONTE DE DADOS (DATASOURCE - MYSQL)
# ====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sales?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ====================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.open-in-view=false

# ====================================================
# CONFIGURAÇÃO DO THYMELEAF
# ====================================================
spring.thymeleaf.cache=false

# These credentials are mandatory; configure them outside the repository.
app.security.username=${APP_SECURITY_USERNAME:}
app.security.password=${APP_SECURITY_PASSWORD:}